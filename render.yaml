services:
  - type: web
    name: attendance-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.6"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Set these in the Render dashboard after the first deploy (values depend on
      # your Neon connection string and chosen domains) — see backend/README-DEPLOY.md.
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
