name: Database backup

on:
  schedule:
    # Weekly, Monday 7:00 AM IST (= Monday 1:30 AM UTC — GitHub Actions cron
    # always runs in UTC, IST is UTC+5:30). This command emails an attachment
    # on every run (unlike the other two scheduled commands, which are no-ops
    # when there's nothing to report), so weekly keeps it from being a daily
    # inbox item.
    - cron: '30 1 * * 1'
  workflow_dispatch: {}

jobs:
  backup:
    name: Backup (Django dumpdata, emailed to admins)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backup_database
        run: python manage.py backup_database
        env:
          # Same values as the attendance-backend Render web service's env vars
          # (Render dashboard → attendance-backend → Environment), added as repo
          # secrets under Settings → Secrets and variables → Actions. SECRET_KEY
          # doesn't need to match Render's — any random string works, since this
          # workflow never serves HTTP requests, just runs one management command.
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
