name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check
        env:
          SECRET_KEY: ci-only-secret-key
          DEBUG: 'False'

      - name: Run tests
        run: python manage.py test
        env:
          SECRET_KEY: ci-only-secret-key
          DEBUG: 'False'
          # DEBUG=False turns on SECURE_SSL_REDIRECT by default (see config/settings.py)
          # — correct in production behind Render's real HTTPS proxy, but CI's test
          # client makes plain http:// requests with no X-Forwarded-Proto header, so
          # any test going through the full middleware stack (not just
          # APIRequestFactory + as_view(), which bypasses middleware) gets 301-redirected
          # instead of reaching the view. Doesn't affect the deployed app's security.
          SECURE_SSL_REDIRECT: 'False'

  frontend:
    name: Frontend (React/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://ci-build-placeholder.example.com
